id: sandbox-sandboxprovider
title: SandboxProvider
kind: service
does:
- 'Скрывает, где исполняется контейнер: Docker сейчас, K8s позже'
- 'Создаёт среду по профилю: образ, runtime, ресурсы, свой `/workspace`'
- Уничтожает среду вместе с `/workspace`; общих томов между запусками нет
tech: Интерфейс create / claim / exec / destroy; Docker сейчас, K8s позже
stories:
- '11.1'
- '11.4'
io:
- dir: in
  with: Agent Runner
  what: '`SandboxClaim`, `RepoGrant` (I6; этап 4 — I23)'
  via: I6
- dir: out
  with: Harness
  what: контейнер со средой запуска (I7 идёт внутри него)
  via: I7
data:
- table: sandbox_profile
  access: read
  why: 'через Runner: `image`, `runtime`, `cpu`, `memory_mb`, `disk_gb` (владелец — Platform module)'
params:
- provider
- runtime
reqs:
- FR-82
- FR-91
- FR-92
- FR-94
tasks:
- '2.2'
- '4.6'
on_failure: 'Docker / K8s API не ответил за 30 с: вызов прерывается, повтор 1 раз; create не повторяется автоматически;
  Образ не скачивается: запуск не стартует, профиль помечен недоступным; Нет ресурсов хоста: запуск ждёт в `queued`'
why: Смена Docker → K8s → microVM без изменения Runner.
rnd: sandbox-isolation.md
operations:
- name: create / exec / destroy контейнера — Docker Engine API (этапы 1–3)
  caller: Agent Runner
  via: I6
- name: create / destroy Pod в namespace `itsaplan-agents` — Kubernetes API (этап 4)
  caller: Agent Runner
  via: I23
