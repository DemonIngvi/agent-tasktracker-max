id: sandbox-egress-proksi
title: Egress-прокси
kind: service
does:
- Весь исходящий трафик только через прокси
- Блокирует запрещённые хосты, пишет событие
- Реестры пакетов — только подсети шага подготовки
- 'Секреты: внешние хосты — прокси; MCP — MCP-прокси Runner'
tech: 'Squid (D18): allowlist доменов по CONNECT, без расшифровки TLS; две подсети — среда агента и шаг подготовки
  (D19)'
stories:
- '11.3'
io:
- dir: in
  with: Sandbox (среда агента)
  what: исходящие соединения
  via: I17
- dir: out
  with: «внешние хосты»
  what: разрешённые запросы с подставленным секретом
  via: I17
data:
- table: sandbox_profile
  access: read
  why: '`egress_allow` профиля (владелец — Platform module)'
- table: access_policy
  access: read
  why: конфиг allowlist генерируется из политики доступа (владелец — Platform module)
params:
- network.egress_allow
- setup.registries
reqs:
- FR-87
- FR-88
- FR-94
tasks:
- '4.2'
on_failure: 'Прокси упал: исходящий трафик запрещён (fail-closed), перезапуск прокси; Домен вне allowlist: соединение
  блокируется, событие фиксируется; Реестр пакетов недоступен на шаге подготовки: шаг завершается ошибкой, запуск
  `failed`; есть кэш — используется кэш'
why: Закрывает утечки и доступ к внутренним сервисам (G3).
rnd: sandbox-isolation.md
operations:
- name: CONNECT / HTTP к внешнему хосту — пропуск по allowlist подсети источника
  caller: среда агента (`sbx-agent`), контейнер подготовки (`sbx-setup`)
  via: I17
- name: подстановка учётных данных внешнего хоста; подставленный секрет агенту не возвращается
  caller: внутри
  via: I17
