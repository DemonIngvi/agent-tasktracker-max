id: sandbox-credential-helper
title: Credential helper
kind: service
does:
- Даёт git доступ к репозиторию без секрета в окружении
- Клонирует только репозитории из манифеста с правом read или write
- Запрещает push в защищённые ветки — только ветка агента
- Право read запрещает запись и выгрузку папки
tech: git credential helper / подстановка прокси
stories:
- '11.2'
- '11.5'
- '11.7'
io:
- dir: in
  with: Agent Runner
  what: '`RepoGrant`: какие репозитории и ветки, без токена'
  via: I6
- dir: out
  with: «git-провайдер»
  what: клон, ветка `agent/<KEY>`, PR через прокси
- dir: out
  with: infrastructure
  what: папка задачи из RustFS и выгрузка подпапки шага (I19, через Runner)
  via: I19
data:
- table: access_policy
  access: read
  why: 'через Runner: права read / write агента на ресурс (владелец — Platform module, AD-18)'
- table: project_resource
  access: read
  why: 'через Runner: git и папки проекта (владелец — Platform module)'
params:
- workspace.sources
- repos.clone_depth
reqs:
- FR-84
- FR-85
- FR-88
- FR-89
tasks:
- '2.2'
- '4.2'
on_failure: 'Репозиторий вне allowlist: доступ отклонён; Push в защищённую ветку: отклонён; RustFS недоступен: старт
  без папки: запуск с ошибкой «нет рабочего пространства»; выгрузка — повтор 3 раза, затем итог с пометкой «артефакты
  не сохранены»'
why: Агент не видит токен — не может его утечь.
rnd: sandbox-isolation.md
operations:
- name: 'клон источников манифеста в `/workspace/<имя>`: git — ветка `agent/<KEY>`, папка — копия из объектного
    хранилища'
  caller: Agent Runner при старте среды
  via: I6
- name: выдача учётных данных git по `RepoGrant` (токен в env не попадает)
  caller: git в среде агента
  via: внутри
- name: выгрузка своей подпапки шага (право write) в объектное хранилище
  caller: Agent Runner в конце запуска
  via: I19
