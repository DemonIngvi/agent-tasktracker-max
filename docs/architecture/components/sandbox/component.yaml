id: sandbox
title: Sandbox
owner: владелец платформы
lifecycle: planned
criticality: medium
system: agent-platform
responsibility: Одноразовый изолированный контейнер из тёплого пула; эфемерный /workspace, egress-прокси, доступ
  к репозиториям.
purpose: 'Изоляция: каждый запуск агента идёт в своём одноразовом контейнере и не видит другие запуски и хост.'
does:
- Держит тёплый пул готовых контейнеров
- Ограничивает CPU, память, диск по профилю (G3)
- Даёт эфемерный /workspace и клон нужных репозиториев
- Пускает трафик только через egress-прокси; реестры пакетов — только шагу подготовки
- 'Секретов в среде нет: ключи подставляют egress-прокси и MCP-прокси Runner'
chain:
- agent-runner
- sandbox
- harness
