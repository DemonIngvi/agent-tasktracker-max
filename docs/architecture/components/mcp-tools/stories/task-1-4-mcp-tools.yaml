id: task-1-4-mcp-tools
number: '7.6'
component: mcp-tools
role: Эксплуатация
want: '1.4. Harness: MCP и тулы'
so_that: требования без пользовательской истории были реализованы
accept:
- '`servers` (подключённые MCP-серверы) не задан в конфигурации → применяется значение по умолчанию: itsaplan-core'
- '`timeout_s` задан больше 300 → значение отклонено, ошибка называет `timeout_s` и границы 5–300'
- модуль сохраняет MCP-серверы проекта, тулы и навыки, ссылки на секреты → запись попадает в S1 (PostgreSQL 17 (CloudNativePG),
  БД `itsaplan`)
- S1 (PostgreSQL 17 (CloudNativePG), БД `itsaplan`) не отвечает → тулы ICPlan возвращают ошибку агенту с типом «недоступно»;
  агент не повторяет записи сам
- 'Harness → MCP-серверы (I9) не ответил за 30 с → вызов прерывается; повтор: чтение — 2 раза; запись — нет'
- собеседник по I17 отклонил учётные данные (allowlist хостов, подстановка секретов) → вызов не повторяется, событие
  с причиной
- mcp-сервер недоступен → ошибка тула агенту
- секрет mcp не задан → тулы сервера недоступны агенту, предупреждение
reqs:
- FR-183
- FR-184
- FR-185
- FR-186
source: TASK-1-4-mcp-tools
