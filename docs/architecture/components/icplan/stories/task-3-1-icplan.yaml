id: task-3-1-icplan
number: '4.31'
component: icplan
role: Эксплуатация
want: '3.1. ICPlan: процесс типа задачи и агент шага'
so_that: требования без пользовательской истории были реализованы
accept:
- '`step.agent` (агент шага (пусто — ручной шаг)) не задан в настройках → применяется значение по умолчанию: нет'
- '`step.max_runs` задан больше 10 → значение отклонено, ошибка называет `step.max_runs` и границы 1–10'
- модуль сохраняет процессы и шаги (`process`, `process_step`), флаги задач, Действия,… → запись попадает в S1 (PostgreSQL
  17 (CloudNativePG), БД `itsaplan`)
- S1 (PostgreSQL 17 (CloudNativePG), БД `itsaplan`) не отвечает → итог не принимается и остаётся у Runner, который
  повторяет отправку (FR-17); переход по итогу выполняется, когда итог принят
- 'ICPlan Run Queue → Agent Runner (I1) не ответил за 10 с → вызов прерывается; повтор: backoff до 60 с'
- пользователь без права изменения меняет процессы и шаги (`process`, `process_step`), флаги задач, Действия, история
  переходов → API ICPlan отклоняет запрос (403), данные не меняются, событие в журнале
reqs:
- FR-208
- FR-209
- FR-210
