id: us-icp-03
number: '4.3'
component: icplan
role: Пользователь ICPlan
want: получить уведомление, когда агент ждёт моего решения или закончил
so_that: не держать агента в ожидании и не проверять задачи вручную
accept:
- Запрос подтверждения или вопрос → уведомление исполнителю задачи
- Итог шага или ошибка → уведомление по настройкам пользователя (в ICPlan, Telegram)
- Нет прав на подтверждение → кнопка недоступна, решение не принимается
reqs:
- FR-6
- FR-5
source: US-ICP-03
