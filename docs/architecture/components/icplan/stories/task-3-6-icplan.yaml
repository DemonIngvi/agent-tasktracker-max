id: task-3-6-icplan
number: '4.32'
component: icplan
role: Эксплуатация
want: '3.6. ICPlan: переходы по итогу запуска и очередь агента'
so_that: требования без пользовательской истории были реализованы
accept:
- агент шага «Проверка» завершил запуск с исходом `defect` и `returnTo = code`, а в `transitions` шага есть `defect
  → code` → задача возвращается на шаг «Код», `returnNote` попадает в задание нового запуска и в историю задачи
- агент вернул исход, которого нет в `transitions` шага → переход не выполняется, запуск завершён ошибкой шага с
  причиной «недопустимый исход», уведомление владельцу процесса
- по задаче уже `maxTotalRuns` запусков, а процесс требует ещё один → запуск не создаётся, переход при ошибке с
  причиной «лимит задачи», уведомление владельцу процесса
- задача прошла круг «Код → Проверка → Код», а нового результата между запусками нет → следующий запуск не создаётся,
  переход при ошибке с причиной «нет прогресса»
reqs:
- FR-205
- FR-206
source: TASK-3-6-icplan
