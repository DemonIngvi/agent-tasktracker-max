id: task-4-6-infrastructure
number: '5.8'
component: infrastructure
role: Эксплуатация
want: '4.6. Kubernetes: k3s, Helm, namespaces, Traefik, сетевые политики'
so_that: требования без пользовательской истории были реализованы
accept:
- Runner обращается к API ICPlan → соединение разрешено политикой
- контейнер запуска пытается подключиться к Postgres напрямую → соединение блокируется
- в values `<сервис>.replicas` меньше 1 → `helm upgrade` отклонён схемой с именем параметра и границей
- в values изменено `<сервис>.replicas` с 1 на 2 → реплики добавлены без простоя, проверки готовности зелёные
- 'Пользователи → Traefik → web / api / mcp (I21) не ответил за 60 с (ingress) → вызов прерывается; повтор: нет'
- собеседник по I22 отклонил учётные данные (логин / пароль из Secret, роль на схему) → вызов не повторяется, событие
  с причиной
- 'выполняется установка: k3s один узел; namespaces `itsaplan-core`, `itsaplan-data`, `itsaplan-agents`, `itsaplan-platform`;
  Traefik ingress; CloudNativePG + PgBouncer; RustFS → компоненты подняты в порядке проверок готовности'
- обновляется чарт компонента → замена по одной реплике, проверки готовности зелёные
- администратор разворачивает сервисы в одной из сред → сервисы используют namespace, базу данных и учётные данные
  этой среды, не общие с другими средами
- workload пытается подключиться к базе данных или прочитать Kubernetes Secret другой среды → доступ отклонён
reqs:
- FR-167
- FR-170
- FR-172
- FR-174
- FR-175
source: TASK-4-6-infrastructure
