role: Эксплуатация
want: 3.9. Сводка задач с агентами и статистика агентов
so_that: требования без пользовательской истории были реализованы
accept:
- администратор открывает стоимость на принятую задачу агента с включённым обучением → итог включает затраты на
  обучение, токены обучения видны отдельно от токенов задач
- инженер сравнивает режимы «без обучения» и «факты» за период → видны стоимость на принятую задачу, доля принятых
  и число прогонов по каждому режиму
