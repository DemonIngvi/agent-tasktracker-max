id: task-4-4-platform-module
number: '10.10'
component: platform-module
role: Эксплуатация
want: 4.4. Platform module в ICPlan
so_that: требования без пользовательской истории были реализованы
accept:
- администратор применяет изменение плейбука (режим `apply_gated`) → до применения создан снимок, применённая версия
  ссылается на него
- владелец агента создаёт снимок вручную → снимок появляется в списке с автором и временем; содержит все пять частей
- владелец откатывает агента на снимок N → указатель указывает на снимок N, следующий запуск идёт на нём, операция
  заняла ≤ 5 минут
- после применения метрика эталона хуже снимка сверх шума → указатель возвращён на предыдущий снимок, человек получил
  уведомление с причиной
- Agent Runner запрашивает настройки агента перед запуском → получает их через API модуля
- сервис пытается читать таблицы модуля напрямую → доступа нет, только через API
- у агента `apply_gated`, у проекта `suggest`, политика администратора не ограничивает → эффективный режим вида
  `suggest`
- администратор запрещает `apply_gated` для команды → проект команды не может включить режим выше `suggest`; результат
  верен для всех сочетаний уровней
- владелец проекта открывает «Платформа» агента → видны режимы по видам с эффективным значением и уровнем, определившим
  его
- владелец выбирает снимок N и подтверждает откат → выполняется FR-65, в журнале запись об откате
- модуль сохраняет настройки агентов, версии, профили sandbox и памяти, данные… → запись попадает в S2 (Postgres
  ICPlan, схема `platform`)
- S2 (Postgres ICPlan, схема `platform`) не отвечает → сохранение настроек отклоняется с причиной; Runner не стартует
  новые запуски (нет настроек)
- 'Agent Runner → Platform module API (I4) не ответил за 2 с → вызов прерывается; повтор: 3 раза'
- собеседник по I15 отклонил учётные данные (master key (Secret)) → вызов не повторяется, событие с причиной
reqs:
- FR-64
- FR-65
- FR-96
- FR-103
- FR-104
- FR-106
- FR-107
source: TASK-4-4-platform-module
