id: task-2-3-platform-module
number: '10.9'
component: platform-module
role: Эксплуатация
want: 2.3. Конфиг агента из ICPlan + YAML
so_that: требования без пользовательской истории были реализованы
accept:
- '`agent.tools` (тулы агента из каталога) не задан в настройках → применяется значение по умолчанию: нет'
- настройку сохраняют без `agent.model` → сохранение отклонено, ошибка называет `agent.model`
- 'модуль сохраняет определения агентов: модель, инструкция, тулы, навыки, MCP-серверы,… → запись попадает в S1
  (PostgreSQL 17 (CloudNativePG), БД `itsaplan`)'
- S1 (PostgreSQL 17 (CloudNativePG), БД `itsaplan`) не отвечает → определения не читаются — запуски не стартуют
- 'ICPlan → Agent Runner: определение агента в выданном запуске (`/agent-runs/claim`) (I1) не ответил за 10 с →
  вызов прерывается; повтор: backoff до 60 с'
- 'пользователь без права изменения меняет определения агентов: модель, инструкция, тулы, навыки, MCP-серверы, проекты,
  версии → API ICPlan отклоняет запрос (403), данные не меняются, событие в журнале'
- бд icplan недоступна → определения не читаются — запуски не стартуют
- удалён ресурс, на который ссылаются → удаление отклоняется
reqs:
- FR-59
- FR-60
- FR-61
- FR-62
