id: guardrails-opa
title: OPA
kind: service
does:
- Решения allow / deny / confirm для G1 (допуск, бюджет) и G2 (действие агента) по `PolicyInput`
- Загружает бандл (Rego из git и данные агентов из Platform module) опросом раз в 30 с; при битом бандле остаётся
  на прежнем
- Кэширует решение для одинакового входа в запуске на `opa.cache_ttl_s`; каждое решение попадает в аудит с `run_id`
tech: Open Policy Agent v1.21.1 (Apache-2.0)
stories:
- '2.1'
- '2.2'
- '2.6'
io:
- dir: in
  with: Agent Runner (Admission)
  what: '`PolicyInput` G1'
  via: I5
- dir: in
  with: Harness (hooks)
  what: '`PolicyInput` G2'
  via: I10
- dir: in
  with: Platform module и git (Rego)
  what: 'bundle: правила и данные агентов'
  via: I16
- dir: out
  with: Agent Runner и Harness
  what: '`PolicyDecision`: allow / deny / confirm с причиной и правилом'
data:
- table: agent_settings
  access: read
  why: 'через бандл: `tools_allow`, `approval_tools`, `autonomy_level`, бюджеты агента (владелец — Platform module)'
- table: kill_switch
  access: read
  why: 'через бандл: аварийная остановка платформы и агентов (владелец — Platform module)'
params:
- engine
- on_engine_error
- opa.cache_ttl_s
- bundles.<name>.resource
reqs:
- FR-110
- FR-111
- FR-112
- FR-116
- FR-117
- FR-120
- FR-124
- FR-125
tasks:
- '4.3'
on_failure: 'OPA недоступен или ответил медленнее 200 мс: решение по `on_engine_error`: deny (`policy_unavailable`)
  по умолчанию, allow с пометкой «без проверки» только в dev (FR-116, FMEA «OPA недоступен»); Битый Rego: OPA остаётся
  на прежнем бандле, ошибка загрузки видна (FMEA «Битый Rego»); Нет данных правил агента: deny всех тулов, кроме
  явно разрешённых в L0 (FMEA «Нет данных правил агента»); Хранилище правил недоступно: OPA работает на последнем
  загруженном бандле, без бандла — `on_engine_error` (FMEA «Хранилище правил недоступно»)'
why: Правила как код, тесты, аудит; CNCF graduated (решение AD-6).
rnd: guardrails-engine.md
operations:
- name: POST /v1/data/agent/g1
  caller: Agent Runner перед созданием sandbox
  via: I5
- name: POST /v1/data/agent/g2
  caller: Harness hooks и MCP-прокси Runner
  via: I10
- name: 'bundles API: загрузка `opa-bundle` раз в 30 с'
  caller: OPA
  via: I16
