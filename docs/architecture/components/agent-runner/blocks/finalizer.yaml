id: agent-runner-finalizer
title: Finalizer
kind: service
does:
- Пишет итог в задачу, частичный — с пометкой «не завершено» (FR-73)
- Освобождает слоты
- Уничтожает контейнер после любого терминального статуса, пул доливается (FR-75)
tech: Go
stories:
- '1.1'
- '4.4'
io:
- dir: in
  with: Run supervisor
  what: '`RunResult` или причина остановки'
- dir: out
  with: ICPlan
  what: '?'
  via: I2
- dir: out
  with: RustFS
  what: вложения
  via: I19
- dir: out
  with: Sandbox
  what: destroy
  via: I6
- dir: out
  with: Scheduler
  what: освобождённые слоты
data:
- table: agent_run
  access: write
  why: итог (таблица ICPlan, M2 пишет ICPlan)
- table: scheduler_slot
  access: write
  why: освобождение слотов
params:
- pool.size
reqs:
- FR-72
- FR-73
- FR-75
- FR-83
- FR-17
tasks:
- '2.1'
- '2.2'
- '2.6'
on_failure: 'Контейнер не удалился: повтор удаления (destroy идемпотентен), событие; слот не занимается; ICPlan
  не принял итог: повтор отправки; переход задачи — когда итог принят; Итог не по формату определения: `gate_failed`
  или пометка несоответствия; RustFS недоступно: повтор 3 раза (I19); сценарий отказа итога — задача 2.6.6'
why: Каждый запуск заканчивается чисто, без хвостов.
rnd: sandbox-isolation.md
operations:
- name: POST /agent-runs/:runId/result
  caller: Finalizer
  via: I2
- name: вложения итога в объектное хранилище (S3 API)
  caller: Finalizer
  via: I19
- name: '`SandboxProvider.destroy` и долив пула'
  caller: Finalizer
  via: I6
- name: освободить слоты запуска в `scheduler_slot`
  caller: Finalizer
  via: внутри
