id: agent-runner-scheduler
title: Scheduler
kind: service
does:
- 'Стартует запуск, только когда свободны все слоты: глобальный, агента, модели, задачи'
- Держит запуск в `queued` с причиной ожидания; порядок `fifo` или `priority` со старением `scheduling.aging_s`
- Общие слоты для нескольких Runner через Postgres
- Освобождает глобальный и модельный слоты на время `waiting_approval`
tech: Go + таблица слотов scheduler_slot в схеме runner (вариант B, D14, D22)
stories:
- '1.2'
- '1.3'
- '1.4'
- '1.5'
io:
- dir: in
  with: Poller
  what: '`Run` в `queued`'
- dir: out
  with: Admission
  what: запуск, получивший слоты
- dir: in
  with: Event relay
  what: '`waiting_approval` и решение по approve'
- dir: out
  with: Postgres
  what: слоты `scheduler_slot`
  via: I22
data:
- table: scheduler_slot
  access: read-write
  why: слоты и аренды
params:
- scheduling.mode
- scheduling.global_max
- scheduling.per_issue
- scheduling.models.<alias>.max
- scheduling.agents.<id>.parallel / max
- concurrency
- scheduling.order
- scheduling.aging_s
reqs:
- FR-67
- FR-68
- FR-69
- FR-70
- FR-71
- FR-77
- FR-78
tasks:
- '2.7'
on_failure: 'Таблица слотов недоступна: новые запуски не стартуют (fail-closed), активные продолжаются; после восстановления
  слоты пересчитываются по активным запускам (FR-71, FMEA «Postgres платформы»); Экземпляр Runner упал с занятыми
  слотами: слоты освобождаются по истечении аренды `lease_until`; Конфиг `scheduling` вне границ: значение отклоняется
  с именем параметра и границами, без обязательных параметров Runner не стартует'
why: Учитывает общие модели и агентов, которые нельзя параллелить; режим платформы — одной настройкой.
rnd: runner-and-scheduling.md
operations:
- name: занять слоты запуска — глобальный, агента, модели, задачи — одной транзакцией в `scheduler_slot` с арендой
    `lease_until`
  caller: Poller после claim; Event relay после решения по approve
  via: внутри
- name: освободить глобальный слот и слот модели при `waiting_approval`, слот задачи держать
  caller: Event relay
  via: внутри
- name: забрать просроченные аренды слотов упавшего экземпляра
  caller: Scheduler по `lease_until`
  via: внутри
- name: причина ожидания («ждёт слот модели») — в события запуска
  caller: Scheduler → Event relay
  via: внутри
