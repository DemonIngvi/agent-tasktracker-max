id: agent-runner-mcp-proksi
title: MCP-прокси
kind: service
does:
- Отдаёт агенту только разрешённые тулы
- 'Проверяет каждый вызов вне sandbox: allowlist манифеста и G2 в OPA'
- Подставляет учётные данные MCP-сервера из Secret по `auth.secret_ref`
tech: Go, официальный MCP Go SDK (D19)
stories:
- '7.5'
- '11.3'
io:
- dir: in
  with: Harness
  what: '?'
  via: I9
- dir: out
  with: Guardrails (OPA)
  what: '`PolicyInput` → `PolicyDecision`'
  via: I10
- dir: out
  with: MCP itsaplan-core в api ICPlan
  what: '?'
  via: I24
- dir: out
  with: Event relay
  what: решение G2 с причиной
data:
- table: project_resource
  access: read
  why: MCP-серверы агента (`kind = mcp`, владелец Platform module)
- table: run_event
  access: write
  why: решения G2 (владелец Observability)
params:
- servers
- tools
- auth.secret_ref
reqs:
- FR-177
- FR-178
- FR-79
- FR-112
tasks:
- '2.1'
on_failure: 'Тул вне allowlist: вызов отклонён без обращения к серверу, решение G2 с причиной в событиях (FR-79
  «MCP-прокси запуска»); MCP-сервер недоступен: агент получает ошибку тула, цикл продолжается; чтение повторяется
  2 раза, запись — нет (FMEA «MCP-сервер недоступен», I9); OPA не ответила: решение по `on_engine_error` (deny)'
why: Проверка внутри sandbox обходится кодом агента; Runner уже знает манифест, токен и подтверждения.
rnd: mcp-vs-direct.md
operations:
- name: POST /runs/:runId/mcp/:server
  caller: Harness, токен запуска
  via: I9
- name: POST /v1/data/agent/g2
  caller: MCP-прокси перед вызовом сервера
  via: I10
- name: POST /mcp
  caller: MCP-прокси
  via: I24
