id: agent-runner-run-supervisor
title: Run supervisor
kind: service
does:
- На старте после слотов берёт определение и настройки версии запуска — `GET /platform/runs/:runId/agent` (I4, AD-23)
- Запускает Harness с `RunBundle`
- Следит за таймаутом, простоем, отменой
- 'Хранит checkpoint цикла Harness в схеме `harness_ckpt` (I12): учётных данных БД в sandbox нет'
tech: Go
stories:
- '1.1'
- '4.4'
- '1.6'
- '3.5'
io:
- dir: in
  with: Platform module
  what: '?'
  via: I4
- dir: out
  with: Harness
  what: '`RunBundle`, отмена'
  via: I7
- dir: out
  with: ICPlan
  what: 'heartbeat: аренда, отмена — 404'
  via: I3
- dir: in
  with: Harness
  what: '?'
  via: I12
- dir: out
  with: Finalizer
  what: итог или причина остановки
data:
- table: run_checkpoint
  access: read-write
  why: checkpoint цикла
- table: agent_run
  access: read
  why: 'через I4: версия запуска `agent_version` закрепляется Platform module (таблица ICPlan)'
params:
- timeout_s
- limits.idle_s
- retry
reqs:
- FR-66
- FR-72
- FR-74
- FR-76
- FR-119
- FR-23
- FR-7
- FR-80
tasks:
- '2.1'
- '2.6'
on_failure: 'Нет настроек агента или агент выключен: запуск `agent_unavailable`, sandbox не создаётся (FR-66, FMEA);
  Platform module недоступен: новые запуски не стартуют, кэш настроек не используется (FMEA); Превышен `timeout_s`
  или простой `limits.idle_s`: `limit_exceeded`, частичный итог, слот освобождается; Heartbeat вернул 404: Harness
  останавливается, итог не шлётся; Runner упал: аренда истекает, запуск возвращается в очередь; при повторной выдаче
  Harness продолжает с последнего checkpoint'
why: Зависшие запуски не держат слоты.
rnd: runaway-protection.md
operations:
- name: GET /platform/runs/:runId/agent
  caller: Run supervisor после слотов
  via: I4
- name: GET /platform/runs/:runId/manifest
  caller: Run supervisor
  via: I4
- name: '`GET /ready`, затем `POST /run` с `RunBundle`; отмена — `POST /run/cancel`'
  caller: Run supervisor
  via: I7
- name: POST /agent-runs/:runId/heartbeat
  caller: Run supervisor
  via: I3
- name: GET /runs/:runId/checkpoint
  caller: Harness, токен запуска
  via: I12
