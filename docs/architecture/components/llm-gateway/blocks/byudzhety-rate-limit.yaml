id: llm-gateway-byudzhety-rate-limit
title: Бюджеты, rate limit
kind: service
does:
- Отклоняет вызов до траты при превышении
- Ограничивает запросы и токены в минуту на модель и на агента (RPM / TPM)
tech: LiteLLM budgets, RPM / TPM
stories:
- '6.3'
io:
- dir: in
  with: Harness
  what: вызов модели с virtual key
  via: I8
- dir: in
  with: Platform module
  what: бюджет и лимиты ключа
  via: I15
- dir: out
  with: PostgreSQL 17
  what: расход и бюджеты в БД `litellm`
  via: I14
data:
- table: LiteLLM_VerificationToken
  access: read
  why: 'чтение и запись: расход, бюджет, лимиты ключа (владелец — LiteLLM)'
- table: LiteLLM_BudgetTable
  access: read
  why: бюджеты и лимиты (владелец — LiteLLM)
params:
- key.max_budget
- key.rpm / tpm
reqs:
- FR-138
- FR-120
- FR-123
tasks:
- '4.5'
on_failure: 'Бюджет virtual key исчерпан: отказ до обращения к провайдеру; Превышен TPM модели: вызовы ждут или
  отклоняются с ошибкой лимита; БД `litellm` недоступна: проверка бюджетов невозможна, вызовы отклоняются'
why: Жёсткий стоп перерасхода на уровне шлюза (G4).
rnd: runaway-protection.md
operations:
- name: отказ вызова при исчерпанном бюджете или лимите частоты
  caller: Harness
  via: I8
