number: '8.10'
component: memory
role: Безопасность
want: чтобы переписка, итоги и состояния удалялись по срокам хранения
so_that: не хранить лишние данные и персональные данные
accept:
- Память не отдаёт M1 и M2 старше срока профиля (M1 30 д, M2 180 д); M3 удаляется по профилю после закрытия задачи;
  запуски и треды чата удаляет ICPlan по `runs.retention_days` и `chat.retention_days` (AD-25)
- Удаление попадает в журнал
- Очистка не прошла → повтор и уведомление эксплуатации
reqs:
- FR-43
- FR-42
- FR-13
