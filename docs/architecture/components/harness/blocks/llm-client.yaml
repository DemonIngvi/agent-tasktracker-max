id: harness-llm-client
title: LLM client
kind: service
does:
- Вызывает модель только через LiteLLM
- Передаёт метаданные для учёта
- Повторяет вызов с backoff (2 раза); токены повтора учитываются в бюджете
tech: OpenAI-совместимый клиент → LiteLLM
stories:
- '3.1'
io:
- dir: in
  with: Context Manager
  what: запрос по слоям
- dir: out
  with: llm-gateway
  what: '?'
  via: I8
- dir: out
  with: Tool Executor
  what: запросы вызова тулов из ответа модели
data:
- table: LiteLLM_SpendLogs
  access: indirect
  why: LiteLLM пишет расход вызова с `metadata.run_id` (владелец — LLM Gateway)
- table: LiteLLM_VerificationToken
  access: indirect
  why: virtual key агента проверяет LiteLLM; ключ подставляет egress-прокси (владелец — LLM Gateway)
params:
- model.temperature
- model.top_p
- model.max_output_tokens
- model.reasoning_effort
- model.reasoning_budget_tokens
- model.tool_choice
- model.response_format
- request.timeout_s
reqs:
- FR-21
- FR-33
- FR-34
- FR-30
tasks:
- '1.3'
on_failure: 'LiteLLM недоступен: повтор с backoff; после `circuit.max_errors` — `failed`; Учётные данные отклонены
  по I8: без повтора, событие с причиной; Параметр не поддерживается моделью: LiteLLM отбрасывает его (`drop_params`),
  событие с именем параметра'
why: Одна точка выхода к моделям и учёт затрат по задаче.
rnd: llm-gateway.md
operations:
- name: 'узел `llm`: OpenAI Chat Completions к LiteLLM по алиасу модели агента, SSE-стрим, `metadata.run_id`'
  caller: граф LangGraph
  via: I8
