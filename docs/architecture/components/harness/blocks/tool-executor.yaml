id: harness-tool-executor
title: Tool Executor
kind: service
does:
- Вызывает тулы MCP и нативные
- Ошибки и таймауты возвращает агенту
- Отклоняет путь вне `/workspace`
- 'Собирает артефакты итога: файлы, ветку, PR'
tech: Адаптер MCP → тулы LangGraph
stories:
- '3.1'
- '11.5'
io:
- dir: in
  with: LLM client
  what: запросы вызова тулов
- dir: out
  with: mcp-tools
  what: '`McpToolCall` через MCP-прокси Runner'
  via: I9
- dir: out
  with: Context Manager
  what: результаты тулов в следующий шаг
data:
- table: setup_cache
  access: indirect
  why: '`install_dependencies` → Runner обновляет кэш шага подготовки (владелец — Agent Runner, AD-19)'
- table: issue_attachment
  access: indirect
  why: артефакты из `RunResult` публикует Runner во вложения задачи (владелец — ICPlan)
params:
- model.parallel_tool_calls
- workspace.publish
reqs:
- FR-20
- FR-33
- FR-34
- FR-29
tasks:
- '1.4'
on_failure: 'MCP-сервер недоступен: ошибка тула возвращается агенту, цикл продолжается; Запись через I9 прервалась
  сбоем сети: автоматического повтора нет; Путь вне `/workspace`: вызов отклонён с причиной'
why: Стандарт MCP; вызовы идут через MCP-прокси Runner, ключи — у Runner (AD-19).
rnd: mcp-vs-direct.md
operations:
- name: POST /runs/:runId/mcp/:server
  caller: граф LangGraph
  via: I9
- name: POST /runs/:runId/deps
  caller: агент
  via: I7
- name: файловые тулы в пределах `/workspace`; список артефактов в `RunResult`
  caller: агент
  via: внутри
