id: AD-14
title: Очередь и планирование запусков
binds:
- all
prevents: отход реализации от решения «Очередь и планирование запусков»
rule: 'Альтернативы (R&D v3.1, 11.10.2026): Hatchet (ключи параллельности CEL — вторая очередь и новый
  сервис), River Pro (лимиты по аргументам — платно), Temporal (кластер), Kueue (квоты ресурсов — на этапе
  4, лимит модели остаётся у нас). Очередь запусков — в ICPlan; Agent Runner забирает запуски и решает,
  когда стартовать, планировщиком со слотами (вариант B): запуск стартует, только когда свободны все его
  слоты — глобальный (`global_max`), агента (`parallel`, `max`), модели (`models.<alias>.max`), задачи
  (`per_issue: 1`). Режим `scheduling.mode: sequential / parallel` переключает всю платформу. Порядок
  `fifo / priority`. Несколько экземпляров Runner делят слоты через блокировку в Postgres. …'
