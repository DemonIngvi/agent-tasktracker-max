id: AD-10
title: MCP или прямой вызов
binds:
- all
prevents: отход реализации от решения «MCP или прямой вызов»
rule: 'Гибрид по правилам R1–R7: решает модель — тул; тул для нескольких агентов или с секретом — MCP;
  детерминированное, пакетное и внутреннее — прямой вызов; админ-функции — отдельные MCP по уровню доверия.
  Агент ходит к MCP-серверам только через MCP-прокси Runner (AD-19). / # / Правило / Как / /---/---/---/
  / R1 / Последовательность известна заранее (детерминированно) / прямой вызов (REST / gRPC / SDK) / /
  R2 / Следующий шаг решает модель / тул агента / / R3 / Тул нужен нескольким агентам или держит секрет
  вне агента / MCP-сервер / / R4 / Тул один, стабильный, только внутри Harness / нативный тул Harness
  / / R5 / Пакетные и массовые операции / прямой вызов (MCP медленнее и дороже по токенам) / …'
