id: AD-1
title: 'Sandbox: тёплый пул + одноразовое использование, Docker за интерфейсом `SandboxProvider`'
binds:
- all
prevents: 'нет в источнике, уточнить: «Sandbox: тёплый пул + одноразовое использование, Docker за интерфейсом
  `SandboxProvider`»'
rule: 'Runner работает с интерфейсом `create / claim / exec / destroy`; первая реализация — Docker, следующая
  — K8s Pod. По каждому профилю держится пул из N запущенных sandbox; запуск забирает готовый, после запуска
  sandbox уничтожается, пул доливается (подход Copilot coding agent, E2B, Daytona). - Альтернативы: контейнер
  на запуск без пула (2–10 с старта), контейнер на агента (запуски видят друг друга), контейнер на задачу
  (ресурсы заняты в простое), microVM (сильнее изоляция, сложнее) — можно добавить как провайдера. - Ориентиры
  ресурсов: harness 150–300 МБ RAM, агент-разработчик 0.5–2 ГБ, CPU почти не нужен (ожидание LLM).'
