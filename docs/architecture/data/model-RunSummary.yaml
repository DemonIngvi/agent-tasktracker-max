id: RunSummary
title: итог прошлого запуска для памяти M2 — строка `agent_run` форка
owner: владелец платформы
lifecycle: planned
criticality: medium
class: contract
sensitivity: internal
attributes:
- name: id
  type: int
- name: agentId
  type: int
- name: status
