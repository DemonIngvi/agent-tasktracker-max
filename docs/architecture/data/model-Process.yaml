id: Process
title: процесс типа задачи (AD-17)
owner: владелец платформы
lifecycle: planned
criticality: medium
class: contract
sensitivity: internal
attributes:
- name: issueType
  type: string
  required: true
  note: тип задачи
- name: owner
  type: string
  required: true
  note: '`username` владельца процесса'
- name: firstStep
  type: string
  required: true
  note: '`id` первого шага'
- name: steps
  type: ProcessStep[]
  required: true
  note: шаги
- name: version
  type: int
  required: true
  note: версия; растёт при каждом изменении; задача на шаге дорабатывает его по старой версии, следующий шаг берёт
    из новой
source:
  kind: ours
  ref: ''
  why: 'Процесс задаётся на тип задачи: тип задачи = тип процесса. Шаги — колонка, агент и переходы; так ICPlan
    сам двигает задачу, агент колонку не меняет.'
