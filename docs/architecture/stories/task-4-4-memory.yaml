id: task-4-4-memory
number: '8.12'
component: memory
role: Эксплуатация
want: 4.4. Platform module в ICPlan
so_that: требования без пользовательской истории были реализованы
accept:
- агент по итогам запусков записывает предложение «добавить в навык проверку миграций» → предложение сохранено со
  ссылкой на запуски, определение агента не изменилось, администратор видит предложение в очереди
- администратор принимает предложение, регрессионный набор пройден без ухудшения и человек утвердил → создаётся
  новая версия настроек (4.4), следующий запуск использует её
- в память пытаются записать правило без ссылки на запуск или задачу → запись отклонена, в журнале причина «нет
  источника»
- запись помечена типом «справка» → в контекст агента она попадает в разделе справки, а не в разделе правил
- администратор переводит вид «факты» из `suggest` в `off` → новые записи не создаются в течение 1 минуты, накопленные
  записи сохранены (потерь 0)
- пользователь удаляет запись памяти в экране 4.4 → со следующего запуска запись не отдаётся агенту, удаление видно
  в журнале изменений
reqs:
- FR-45
- FR-46
- FR-47
source: TASK-4-4-memory
