id: task-4-5-guardrails
number: '2.9'
component: guardrails
role: Эксплуатация
want: '4.5. LiteLLM: бюджеты, fallback, G4'
so_that: требования без пользовательской истории были реализованы
accept:
- промпт содержит строку, похожую на ключ API → строка маскируется до отправки провайдеру
- в промпте нет секретов и PII → запрос уходит без изменений
- суммарный поток токенов к модели превысил TPM → новые вызовы ждут освобождения окна или отклоняются с ошибкой
  лимита
- поток токенов ниже TPM → вызовы проходят без задержки
- расход на обучение превысил потолок → новый цикл обучения не стартует, блокировка наступила не позднее одного
  запуска после превышения
- владелец включает режим обучения выше off, а `budget.project_month` не задан (потолок по умолчанию — 10% от него)
  → сохранение отклонено, ошибка называет `budget.project_month`
reqs:
- FR-114
- FR-123
- FR-132
source: TASK-4-5-guardrails
