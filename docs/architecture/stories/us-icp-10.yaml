id: us-icp-10
number: '4.10'
component: icplan
role: Пользователь ICPlan
want: читать чат задачи с агентом и писать в него указания во время работы
so_that: видеть статус, вопросы и итог в одном месте и поправлять агента без перезапуска
accept:
- Чат показывает статус, вопросы агента и итог по порядку
- Сообщение во время работы → агент получает его на следующем шаге и подтверждает
- Запуск уже завершён → сообщение начинает новый запуск с контекстом чата
- Агент на паузе ожидания → сообщение считается ответом
reqs:
- FR-4
- FR-5
- FR-10
source: US-ICP-10
