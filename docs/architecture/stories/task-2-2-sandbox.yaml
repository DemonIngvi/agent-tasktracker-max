id: task-2-2-sandbox
number: '11.8'
component: sandbox
role: Эксплуатация
want: 2.2. Harness в Docker-контейнере на запуск
so_that: требования без пользовательской истории были реализованы
accept:
- агент ссылается на профиль с увеличенной RAM → его sandbox создаётся с этой RAM
- процесс превысил лимит RAM → контейнер останавливается, запуск получает `failed` с причиной
- '`workspace.sources` (источники рабочего пространства запуска: git,…) не задан в конфигурации → применяется значение
  по умолчанию: нет'
- '`pool.size` задан больше, чем `scheduling.global_max` → значение отклонено: `pool.size` не может быть больше
  `scheduling.global_max`'
- Runner создаёт среду запуска по профилю `light` → у среды свой `/workspace` размером по профилю, чужих томов нет
- '`/workspace` превысил лимит диска профиля sandbox → запись отклоняется, агент получает ошибку тула, запуск продолжается
  или завершается `limit`'
- 'Agent Runner → Docker Engine API (I6) не ответил за 30 с → вызов прерывается; повтор: 1 раз'
- собеседник по I7 отклонил учётные данные (одноразовый токен запуска) → вызов не повторяется, событие с причиной
- нет ресурсов хоста → запуск ждёт в `queued`
- образ недоступен → профиль помечен недоступным, запуски отклоняются
reqs:
- FR-86
- FR-90
- FR-91
- FR-92
- FR-93
source: TASK-2-2-sandbox
