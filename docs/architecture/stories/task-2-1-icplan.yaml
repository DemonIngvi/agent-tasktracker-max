id: task-2-1-icplan
number: '4.30'
component: icplan
role: Эксплуатация
want: 2.1. Agent Runner как внешний раннер ICPlan
so_that: требования без пользовательской истории были реализованы
accept:
- '`agent.kind` (внутренний агент ICPlan или внешний (наш Runner)) не задан в настройках → применяется значение
  по умолчанию: internal'
- '`agent.delegation_delay_sec` задан больше 86400 → значение отклонено, ошибка называет `agent.delegation_delay_sec`
  и границы 0–86400'
- модуль сохраняет агенты (вид, ключ, `enabled`), `agent_run` (очередь, аренда, итоги),… → запись попадает в S1
  (PostgreSQL 17 (CloudNativePG), БД `itsaplan`)
- S1 (PostgreSQL 17 (CloudNativePG), БД `itsaplan`) не отвечает → выдача запусков и приём итогов останавливаются;
  Runner повторяет с backoff, итог держит до восстановления
- 'ICPlan Run Queue → Agent Runner (I1) не ответил за 10 с → вызов прерывается; повтор: backoff до 60 с'
- пользователь без права изменения меняет агенты (вид, ключ, `enabled`), `agent_run` (очередь, аренда, итоги), сообщения
  чата агента → API ICPlan отклоняет запрос (403), данные не меняются, событие в журнале
- runner не в сети → агенты платформы «не в сети», запуски ждут
- несовместимая версия протокола → Runner не берёт запуски
reqs:
- FR-14
- FR-15
- FR-16
- FR-17
source: TASK-2-1-icplan
