component: icplan
role: Пользователь ICPlan
want: обязать процесс по задаче проверяться со мной перед каждым переходом
so_that: важная задача не уходила дальше без моего согласия
accept:
- Включил проверку → после каждого успешного шага задача ждёт моего «принято»
- «Не выполнено» → возврат на шаг с заметкой (как US-ICP-13)
- Нет ответа дольше таймаута → напоминание, задача не двигается
reqs:
- FR-199
- FR-200
