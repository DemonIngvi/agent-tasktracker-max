id: task-3-3-observability
number: '9.6'
component: observability
role: Эксплуатация
want: 3.3. События запуска и чат запуска в задаче
so_that: требования без пользовательской истории были реализованы
accept:
- '`events.level` (детализация событий) не задан в конфигурации → применяется значение по умолчанию: всё'
- '`retention_days` задан больше 365 → значение отклонено, ошибка называет `retention_days` и границы 7–365'
- модуль сохраняет события запусков (`run_event`) → запись попадает в S3 (Postgres ICPlan, схема `platform`)
- S3 (Postgres ICPlan, схема `platform`) не отвечает → события буферизуются у Runner, запуск продолжается; чат запуска
  временно неполный
- 'Agent Runner → ICPlan (шаги, итог) (I2) не ответил за 10 с → вызов прерывается; повтор: повтор с дедупликацией
  по (run_id, seq)'
- собеседник по I14 отклонил учётные данные (пароль из Secret) → вызов не повторяется, событие с причиной
- нет записи событий → буфер в Runner, досылка
- нет цены модели → токены учтены, стоимость «неизвестна»
reqs:
- FR-154
- FR-155
- FR-156
- FR-157
source: TASK-3-3-observability
