id: harness-pause-resume
title: Pause / resume
kind: service
does:
- Останавливается на approve или вопросе
- Продолжает с того же шага без повтора предыдущих
- Восстанавливается после падения процесса из checkpoint Runner
tech: LangGraph interrupt + свой checkpointer через API Runner (I12, D18)
stories:
- '3.2'
- '3.5'
- '3.7'
- '4.11'
io:
- dir: in
  with: Agent Runner
  what: '?'
  via: I7
- dir: out
  with: Agent Runner
  what: '?'
  via: I12
- dir: out
  with: Event stream
  what: '`CUSTOM` `approval_request`, `question`'
data:
- table: run_checkpoint
  access: read-write
  why: через Runner (I12, владелец — Agent Runner; учётных данных БД в sandbox нет)
- table: agent_run_delivery
  access: indirect
  why: решения и ответы доставляет Runner из ICPlan (владелец — ICPlan)
params:
- approval.tools
- checkpoint.ttl
reqs:
- FR-23
- FR-32
tasks:
- '1.5'
on_failure: 'Checkpointer недоступен: пауза невозможна, опасные действия отклоняются; Подтверждение не пришло за
  `approval_timeout`: действие отклонено, запуск продолжается без него или завершается по политике; Процесс упал:
  новый процесс продолжает с последнего сохранённого шага'
why: Ключевое преимущество LangGraph перед своим циклом.
operations:
- name: '`interrupt` перед тулом из `approval.tools` или на вопрос пользователю'
  caller: Hooks, агент
  via: внутри
- name: POST /run/approval
  caller: Agent Runner
  via: I7
- name: PUT /runs/:runId/checkpoint
  caller: Pause / resume → Agent Runner
  via: I12
