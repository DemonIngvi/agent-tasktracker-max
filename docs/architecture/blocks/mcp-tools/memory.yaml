id: mcp-tools-memory
title: memory
kind: service
does:
- Записывает состояние задачи M3 (сделано, дальше, блокеры; передача следующему — артефакты, вопросы, критерии,
  AD-20)
- Проверки записи делает Memory (профиль, область, схема, размер, секреты); тулу возвращается причина отказа
- Используется только Harness, поэтому не MCP-сервер (R4, FR-179)
tech: Нативный тул Harness (R4), запись M3 через Memory API
stories:
- '8.1'
- '3.1'
io:
- dir: in
  with: Harness · Tool Executor
  what: вызов тула памяти с `M3Record`
- dir: out
  with: Memory API
  what: запись M3 (I11, `PUT /m3/:issueId`)
  via: I11
data:
- table: memory_m3
  access: write
  why: через Memory API (I11, владелец — Memory); тул в БД не ходит
params:
- tools
- servers
reqs:
- FR-39
- FR-44
- FR-179
tasks:
- '2.5'
on_failure: 'Memory API недоступен: тулу возвращается ошибка, запуск продолжается; запись M3 повторяется в конце;
  Запись больше `m3_max_kb` или с секретом: отклонена с причиной, агент исправляет или продолжает без записи; Два
  запуска пишут M3 одновременно: сохраняется последняя версия, прежняя остаётся в истории (FR-39 «Конфликт записи»)'
why: Используется только Harness — MCP не нужен, лишний прыжок и описания тула в контексте (R4).
operations:
- name: PUT /m3/:issueId
  caller: Harness · Tool Executor
  via: I11
