id: mcp-tools-git-provayder
title: git-провайдер
kind: service
does:
- Создаёт ветку, коммит и PR; агент отдаёт код через PR, прямого push нет
- Запись — только в ветку с префиксом агента; push в защищённую ветку отклоняется
- Учётные данные держит MCP-сервер и MCP-прокси Runner, в sandbox и контекст агента они не попадают
tech: MCP-сервер git-провайдера (Gitea или GitHub — провайдер выбирается в задаче 4.2)
stories:
- '7.1'
- '7.2'
- '11.2'
io:
- dir: in
  with: MCP-прокси Agent Runner
  what: '`McpToolCall`: `tools/list`, `tools/call`'
  via: I9
- dir: out
  with: «git-провайдер»
  what: вызов API провайдера с короткоживущим токеном от Runner
  via: I18
- dir: out
  with: Harness
  what: ссылка на ветку и PR для `RunResult`
data:
- table: project_resource
  access: read
  why: репозитории проекта (`kind = git`) и MCP-серверы агента (`kind = mcp`, владелец Platform module)
- table: access_policy
  access: read
  why: права агента на репозитории и ветки (владелец Platform module)
params:
- servers
- tools
- timeout_s
- auth.secret_ref
reqs:
- FR-176
- FR-177
- FR-178
- FR-179
- FR-185
- FR-85
tasks:
- '4.2'
on_failure: 'Провайдер недоступен: ошибка тула агенту, цикл продолжается; чтение повторяется 2 раза, запись — нет
  (FMEA «MCP-сервер недоступен», FR-185); Секрет сервера не задан: тулы сервера недоступны агенту, предупреждение
  (FMEA «Секрет MCP не задан»); Тул вне allowlist: вызов отклонён MCP-прокси без обращения к серверу (FR-177 «Тул
  вне списка»); Репозиторий вне манифеста запуска или защищённая ветка: токен не выдан, запись отклонена; Ответ
  длиннее `max_result_kb`: обрезается с пометкой (FR-178 «Большой ответ»)'
why: Агент-разработчик отдаёт код через PR, без прямого push. Тул нужен нескольким агентам и держит секрет вне агента
  — значит MCP-сервер (R3, FR-179).
operations:
- name: '`tools/list` — тулы git-провайдера, отфильтрованные allowlist запуска'
  caller: MCP-прокси Runner
  via: I9
- name: '`tools/call` `branch` — создать ветку с префиксом агента'
  caller: Harness через MCP-прокси Runner
  via: I9
- name: '`tools/call` `commit` — зафиксировать изменения в ветке агента'
  caller: Harness через MCP-прокси Runner
  via: I9
- name: '`tools/call` `pr.create` — открыть PR из ветки агента; ссылка попадает в `RunResult`'
  caller: Harness через MCP-прокси Runner
  via: I9
