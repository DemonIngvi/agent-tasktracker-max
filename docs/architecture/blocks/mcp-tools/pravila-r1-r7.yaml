id: mcp-tools-pravila-r1-r7
title: Правила R1–R7
kind: storage
does:
- 'Выбирает тип новой интеграции: R1, R5, R7 — прямой вызов; R2 — тул агента; R3 — MCP-сервер; R4 — нативный тул
  Harness; R6 — отдельный админ-MCP'
- Не пускает в MCP то, что быстрее и дешевле прямым вызовом (внутренние вызовы платформы, пакетные операции)
- Админ-функции (R6) не подключаются рабочим агентам по умолчанию
tech: Архитектурное правило (design D2, таблица R1–R7)
stories:
- '7.1'
- '7.3'
io:
- dir: in
  with: Harness · Tool Executor
  what: 'вопрос «как подключить тул»: решает модель или детерминированная последовательность'
- dir: out
  with: itsaplan-core
  what: 'R3: тул для нескольких агентов — MCP-сервер'
- dir: out
  with: git-провайдер
  what: 'R3: тул с секретом вне агента — MCP-сервер'
- dir: out
  with: memory
  what: 'R4: стабильный тул только для Harness — нативный'
data:
- table: project_resource
  access: read
  why: подключённые MCP-серверы (`kind = mcp`) — следствие применения правил (владелец Platform module)
params:
- servers
- tools
reqs:
- FR-179
- FR-180
tasks:
- '2.4'
on_failure: 'Интеграция выбрана не по правилам (внутренний вызов через MCP): на ревью задачи возвращается на переделку,
  исключение — решение D; Админ-тул вызван рабочим агентом: вызов отклоняется (FR-180 «Попытка вызова»); Правило
  не покрывает новый случай: открытый вопрос в open-questions.md, R&D по методологии'
why: Экономит токены и задержку, не теряя переиспользование.
schema_ref: 'Таблица R1–R7 в design.md (AD-2): R1 детерминированное → прямой вызов; R2 шаг решает модель → тул агента;
  R3 нескольким агентам или секрет → MCP; R4 один стабильный тул Harness → нативный; R5 пакетные → прямой вызов;
  R6 админ-функции → отдельные MCP; R7 внутренности платформы → прямой вызов. …'
