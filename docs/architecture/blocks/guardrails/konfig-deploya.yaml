id: guardrails-konfig-deploya
title: Конфиг деплоя
kind: storage
does:
- Включает и выключает точки G1–G4 независимо; выключенная точка не проверяется, в логе старта запись
- 'Задаёт поведение при недоступности OPA (`on_engine_error`): deny по умолчанию, allow — только dev'
- Задаёт пороги защиты запуска от зацикливания и ошибок
tech: YAML деплоя (values.yaml, S9)
stories:
- '2.1'
- '2.2'
io:
- dir: in
  with: Эксплуатация
  what: values.yaml в git (изменение — после перезапуска модуля)
- dir: out
  with: Agent Runner (Admission)
  what: переключатель G1 и `on_engine_error`
- dir: out
  with: Harness
  what: переключатель G2 и пороги зацикливания
data:
- table: kill_switch
  access: indirect
  why: аварийная остановка хранится в Platform module (L1), в конфиге деплоя её нет
params:
- g1.enabled / g2.enabled / g3.enabled / g4.enabled
- on_engine_error
- opa.cache_ttl_s
- loop.repeat_calls
- circuit.max_errors
reqs:
- FR-115
- FR-116
- FR-118
- FR-122
- FR-126
tasks:
- '4.3'
on_failure: 'Неизвестная точка (`g5`): сервис не стартует с понятной ошибкой (FR-115 «Неверный конфиг»); Точка выключена:
  проверка не выполняется, в логе старта «G2 disabled» (FMEA «Точка выключена»); Значение вне границ: отклоняется
  с именем параметра и границами'
why: Можно начать без guardrails и включать по мере готовности.
schema_ref: 'Секция `guardrails` в `values.yaml` (S9, git, без секретов): `g1…g4.enabled`, `on_engine_error`, `engine`,
  `opa.cache_ttl_s`, `loop.*`, `circuit.max_errors`, `anomaly.step_x_median`. Пример — Deploy Guardrails, «Пример
  конфигурации».'
