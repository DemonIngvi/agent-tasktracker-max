id: observability-agregaty-zatrat
title: Агрегаты затрат
kind: service
does:
- Считает токены и $ по запуску, задаче, агенту, модели и периоду из журнала LiteLLM по `metadata.run_id`
- Отдаёт затраты задачи (`CostAggregate`) для карточки задачи и сводки
- 'Историю берёт из журнала LiteLLM, а не из событий запуска: удаление событий по `retention_days` агрегаты не затрагивает
  (FR-151)'
- Не получает цену модели — помечает стоимость «неизвестна», токены учитывает
tech: Агрегаты из spend log LiteLLM (журнал LiteLLM_SpendLogs, БД litellm)
stories:
- '9.5'
- '4.12'
io:
- dir: in
  with: LiteLLM (spend log)
  what: записи журнала с `metadata.run_id`
  via: I14
- dir: out
  with: Task UI ICPlan
  what: затраты задачи и сводка
  via: I20
data:
- table: LiteLLM_SpendLogs
  access: read
  why: токены и $ по `metadata.run_id` (роль `litellm_read`, владелец — LLM Gateway)
- table: agent_run
  access: read
  why: связь `run_id` → задача и агент (владелец — ICPlan)
params:
- cost.source
reqs:
- FR-150
- FR-151
- FR-157
- FR-152
- FR-135
tasks:
- '3.5'
- '3.9'
on_failure: 'Нет цены модели: токены учтены, стоимость «неизвестна» (FMEA «Нет цены модели», FR-150); Журнал LiteLLM
  недоступен: затраты показываются как «неизвестно», задача и сводка работают; Срок хранения событий истёк: агрегаты
  затрат сохраняются; Запуск без `run_id`: в агрегат не попадает; отклонение вызова без `run_id` — pre-call хук
  LiteLLM (AD-26, задача 4.5)'
why: Один источник правды по деньгам — LiteLLM; свой учёт токенов расходился бы с провайдером.
operations:
- name: GET /issues/:issueId/costs
  caller: Task UI ICPlan
  via: I20
- name: GET /me/agent-summary
  caller: Task UI ICPlan
  via: I20
- name: GET /projects/:projectKey/analytics/agent-run-stats
  caller: Task UI ICPlan
  via: I20
