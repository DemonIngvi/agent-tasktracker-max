id: memory-memory-api
title: Memory API
kind: service
does:
- Проверяет права и области
- Отдаёт память в контекст запуска
- M1 и M2 старше `retention` профиля не отдаёт; строки форка не удаляет — их удаляет ICPlan, `POST /retention/run`
  чистит только M3 (AD-25)
- Проверяет запись M3 до сохранения (профиль, область, схема и размер, секреты)
- Позволяет администратору удалять записи
tech: Сервис над БД ICPlan
stories:
- '8.1'
- '8.2'
- '8.3'
- '8.10'
io:
- dir: in
  with: Harness · Context Manager
  what: запрос контекста `GET /context` по задаче и агенту
  via: I11
- dir: in
  with: Harness · Tool Executor
  what: запись `M3Record` — `PUT /m3/:issueId`
  via: I11
- dir: in
  with: Администратор
  what: удаление записи — `DELETE /records/:level/:id`, сервисный токен
- dir: in
  with: Kubernetes CronJob
  what: очистка по срокам — `POST /retention/run`, сервисный токен
- dir: out
  with: PostgreSQL 17
  what: чтение M1, M2 и запись M3 через PgBouncer
  via: I22
data:
- table: memory_m3
  access: read
  why: чтение и запись (владелец — Memory, роль `memory`)
- table: agent_run
  access: read
  why: чтение итогов запусков (M2) по GRANT (владелец — ICPlan)
- table: agent_chat_message
  access: read
  why: чтение переписки в треде (M1) по GRANT (владелец — ICPlan)
- table: issue_activity
  access: read
  why: по GRANT (владелец — ICPlan)
params:
- read
- write
- m2_last_runs
- retention
- scope
- m3_max_kb
reqs:
- FR-36
- FR-39
- FR-40
- FR-42
- FR-43
- FR-51
- FR-44
tasks:
- '2.5'
on_failure: 'БД недоступна: чтение отдаёт пустой контекст с предупреждением, запись повторяется; Два запуска пишут
  M3 одновременно: сохраняется последняя версия, прежняя остаётся в истории; Очистка M3 не прошла: записи остаются,
  M3 закрытых задач не отдаётся в контекст, уведомление эксплуатации, повтор задания CronJob; Профиль памяти не
  задан: применяются значения по умолчанию из таблицы параметров; Запись с секретом, больше `m3_max_kb` или на уровень
  вне профиля: отклонена с причиной'
why: Агенты не ходят в БД напрямую.
operations:
- name: GET /context
  caller: Harness · Context Manager
  via: I11
- name: PUT /m3/:issueId
  caller: Harness · Tool Executor
  via: I11
- name: DELETE /records/:level/:id
  caller: Администратор
  via: I11
- name: POST /retention/run
  caller: Kubernetes CronJob
  via: I11
