id: memory-m3-zadachnaya
title: M3 задачная
kind: storage
does:
- Агент записывает состояние работы по задаче
- Следующий агент получает его в контексте
tech: Таблица в БД ICPlan + тул записи
stories:
- '8.1'
- '8.3'
io:
- dir: in
  with: Memory API
  what: запись `M3Record` (`PUT /m3/:issueId`, I11)
  via: I11
- dir: out
  with: Memory API
  what: M3 для контекста следующего запуска (`GET /context`, I11)
  via: I11
data:
- table: memory_m3
  access: read
  why: чтение и запись через Memory API (владелец — Memory, роль `memory`)
params:
- m3_max_kb
- retention
reqs:
- FR-39
- FR-44
tasks:
- '2.5'
on_failure: 'Два запуска пишут M3 одновременно: сохраняется последняя версия, прежняя остаётся в истории; Запись
  больше `m3_max_kb` или с секретом: отклонена с причиной; Очистка M3 не прошла: записи остаются, M3 закрытых задач
  не отдаётся в контекст'
why: Самый дешёвый способ преемственности этапов.
schema_ref: 'Таблица `memory_m3`: ключ — задача и область; `done`, `next`, `blockers` и передача следующему `artifacts`,
  `questions`, `criteria_next` (AD-20); `version` растёт при каждой записи, прежняя версия остаётся в истории.'
