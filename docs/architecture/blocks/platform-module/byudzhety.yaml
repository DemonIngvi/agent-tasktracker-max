id: platform-module-byudzhety
title: Бюджеты
kind: service
does:
- Задаёт лимиты трат агента, проекта, команды
- Отказ до траты, а не после; пороги 80% (предупреждение) и 100% (отказ G1)
tech: Бюджеты virtual key LiteLLM + проверка G1 в Runner
stories:
- '10.1'
- '10.6'
io:
- dir: in
  with: ICPlan UI
  what: бюджеты агента и проекта
  via: I20
- dir: out
  with: LiteLLM
  what: лимит бюджета ключа — `/key/update`, действует сразу
  via: I15
data:
- table: agent_settings
  access: read-write
  why: '`budget_run_usd`, `budget_day_usd`'
- table: project_platform
  access: read-write
  why: '`budget_month_usd`'
- table: LiteLLM_VerificationToken
  access: write
  why: 'через admin API: лимит ключа (I15)'
- table: LiteLLM_BudgetTable
  access: write
  why: 'через admin API: бюджеты (I15)'
params:
- budget.per_run_tokens
- budget.daily_usd
reqs:
- FR-95
- FR-97
- FR-100
tasks:
- '4.4'
on_failure: 'LiteLLM не отвечает при сохранении бюджета: изменение «не применено», повтор (FR-100 «LiteLLM недоступен»);
  Бюджет в модуле и в LiteLLM различается: предупреждение администратору (FR-100 «Рассинхронизация»); Отрицательный
  бюджет или выше потолка: 400 с названием поля'
why: Иерархия бюджетов — стандарт (LiteLLM, облачные биллинги).
operations:
- name: PATCH /platform/agents/:agentId/settings
  caller: Администратор
  via: I20
- name: PUT /platform/projects/:projectKey/budget
  caller: Администратор
  via: I20
- name: Применить лимит к ключу LiteLLM
  caller: Platform module
  via: I15
