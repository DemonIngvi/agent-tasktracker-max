id: infrastructure-pgbouncer
title: PgBouncer
kind: service
does:
- Держит пул серверных соединений
- Защищает Postgres от роста числа клиентов
tech: PgBouncer 1.26 (пулер CloudNativePG), ISC
stories:
- '5.3'
io:
- dir: in
  with: «сервисы» (ICPlan, LiteLLM, Memory API, Runner)
  what: SQL по роли на схему
  via: I22
- dir: out
  with: PostgreSQL 17 + pgvector
  what: не более 30 серверных соединений
  via: I22
data: 'нет: пул соединений без состояния — таблиц модели не хранит, проксирует запросы к PostgreSQL'
params:
- pgbouncer.pool_mode / size
reqs:
- FR-163
- FR-173
tasks:
- '4.7'
on_failure: 'PgBouncer исчерпал пул: запросы ждут до таймаута, ошибка с причиной; восстановление — увеличить пул,
  найти утечку соединений; Клиенту нужна функция уровня сессии (LISTEN / NOTIFY): подключение к session-пулу или
  напрямую, по согласованному списку'
why: Агенты, Runner и LiteLLM множат соединения.
operations:
- name: 'пул соединений transaction pooling: 60 клиентских → не более 30 серверных'
  caller: «сервисы»
  via: I22
