id: icplan-task-ui
title: Task UI
kind: ui
does:
- Доска, статусы, карточка задачи, комментарии, чат агента
- Показывает ход работы агента (чат запуска, задача 3.3) и итог
- Даёт человеку подтвердить опасное действие (3.4)
- Показывает затраты задачи из LiteLLM (3.5)
tech: It's a Plan web (Next.js), доработки в форке
stories:
- '4.1'
- '4.8'
- '4.9'
- '4.2'
- '4.10'
- '4.11'
- '4.3'
- '4.12'
- '4.13'
- '4.14'
- '4.4'
- '4.15'
- '4.16'
- '4.17'
- '4.18'
io:
- dir: in
  with: api ICPlan (SSE)
  what: шаги в чате запуска
  via: I20
- dir: in
  with: api ICPlan
  what: затраты задачи
  via: I20
- dir: out
  with: api ICPlan
  what: смена колонки, approve, указания пользователя, вердикт
  via: I20
data:
- table: issue
  access: read
  why: 'чтение, запись: колонка, делегат, исполнитель, `review_with_me`'
- table: run_event
  access: read
  why: чат запуска (таблица Observability)
- table: agent_run
  access: read
  why: итог запуска
- table: issue_process_state
  access: read
  why: 'чтение, запись: шаг, вердикт `last_verdict`'
- table: agent_run_delivery
  access: write
  why: решения и указания до доставки Runner
- table: LiteLLM_SpendLogs
  access: read
  why: затраты задачи (роль `litellm_read`)
params:
- issue.review_with_me
reqs:
- FR-4
- FR-5
- FR-6
- FR-7
- FR-10
- FR-191
- FR-194
- FR-199
- FR-200
- FR-201
- FR-202
- FR-150
tasks:
- '3.3'
- '3.4'
- '3.5'
- '3.7'
on_failure: 'БД ICPlan недоступна: задача и чат не загружаются, действия пользователя не сохраняются; Runner не
  в сети: агенты помечены «не в сети», запуски ждут в очереди; Поток SSE оборвался: Task UI переподключается, пропущенные
  шаги берёт из `GET /issues/:issueId/agent-feed`; Журнал затрат LiteLLM недоступен или цена не задана: затраты
  показываются как «неизвестно», задача работает'
why: Пользователи остаются в привычном трекере; всё про агента видно в задаче.
screens:
- path: Проект → доска
  shows: колонки процесса, карточки задач, перенос задачи
  status: есть
  file: apps/web/src/features/work-items/WorkItemsPage.tsx
  story: '4.1'
- path: задача
  shows: описание, делегат, исполнитель, комментарии и упоминания агента, история
  status: есть
  file: apps/web/src/features/issue/IssueViewPage.tsx
  story: '4.8'
- path: задача → панель «Агент»
  shows: шаги агента по ходу (AG-UI, AD-21) — `GET /agent-runs/:runId/stream`, история — `GET /issues/:issueId/agent-feed`;
    указание — `POST /agent-runs/:runId/messages`; карточка итога
  status: новое
  file: по образцу apps/web/src/features/ai-chat
  story: '4.2'
- path: чат запуска
  shows: кнопки approve / отклонить, ответ на вопрос агента
  status: новое
  file: apps/web/src/features/ai-chat
  story: '4.11'
- path: карточка итога в чате запуска
  shows: принять результат или вернуть с заметкой
  status: доработка
  file: —
  story: '4.13'
- path: задача
  shows: остановить и возобновить процесс — `POST /issues/:issueId/process/pause`, `/resume`; отменить запуск —
    `POST /agent-runs/:runId/cancel`; повторить шаг — `/process/retry`; передать шаг и «проверять со мной»
  status: доработка
  file: —
  story: '4.14'
- path: история задачи
  shows: по какому правилу агент взял задачу или почему нет
  status: доработка
  file: apps/web/src/features/issue
  story: '4.18'
- path: Входящие
  shows: агент ждёт решения, закончил, ошибка шага
  status: есть
  file: apps/web/src/features/inbox
  story: '4.3'
- path: задача, сводка по агентам
  shows: затраты задачи — `GET /issues/:issueId/costs`; что выполняется и в очереди
  status: новое
  file: —
  story: '4.12'
