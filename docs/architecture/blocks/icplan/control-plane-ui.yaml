id: icplan-control-plane-ui
title: Control Plane UI
kind: ui
does:
- Создание и настройка агентов
- Подключение тулов и навыков; доступ команды к MCP ICPlan
- Проверка агента в чате, выключение агента (3.8)
- Ключи провайдеров команды — только для внутренних агентов ICPlan; агенты платформы ходят к моделям через virtual
  key LiteLLM (AD-5)
tech: 'It''s a Plan web: Команда → ИИ-агенты, Интеграции, Инструменты, Навыки, MCP'
stories:
- '4.20'
- '4.21'
- '4.22'
- '4.23'
- '4.24'
- '4.28'
- '4.19'
- '4.6'
- '4.5'
- '4.25'
- '4.26'
- '4.27'
io:
- dir: out
  with: Registry
  what: 'определение агента: модель, инструкция, тулы, навыки'
- dir: out
  with: Platform module
  what: наши настройки агента
  via: I20
- dir: in
  with: Registry
  what: каталог агентов, тулов, навыков
data:
- table: ai_agent
  access: write
  why: определение агента, `enabled`
- table: apikey
  access: write
  why: ключ агента, показывается один раз
- table: agent_tool_link
  access: write
  why: тулы агента
- table: agent_skill_link
  access: write
  why: навыки агента
- table: integration_credential
  access: write
  why: учётные данные тулов
- table: agent_schedule
  access: write
  why: регулярная работа агента
- table: team
  access: write
  why: '`mcp_enabled` — доступ команды к MCP ICPlan'
- table: project
  access: write
  why: '`mcp_enabled` — проекты, которые охватывает доступ к MCP'
- table: agent_settings
  access: write
  why: 'через API Platform module: наши настройки (I20)'
- table: agent_settings_version
  access: read
  why: 'чтение, запись: история и откат настроек'
- table: kill_switch
  access: write
  why: '`agent:<id>` — карточка, `platform` — God mode'
- table: project_platform
  access: write
  why: руководство, бюджет, шаг подготовки
- table: project_resource
  access: write
  why: ресурсы проекта, в том числе MCP (`kind = mcp`)
- table: access_policy
  access: write
  why: доступы агентов к ресурсам
- table: sandbox_profile
  access: write
  why: профили среды (God mode)
- table: memory_profile
  access: write
  why: профили памяти (God mode)
params:
- agent.model
- agent.instruction
- agent.tools
- agent.skills
- agent.projects
- agent.kind
- agent.enabled
reqs:
- FR-1
- FR-54
- FR-8
- FR-11
- FR-12
- FR-58
- FR-190
- FR-196
- FR-203
tasks:
- '2.3'
- '3.1'
- '3.5'
- '3.8'
on_failure: 'БД ICPlan недоступна: настройки не сохраняются, определения не читаются, запуски не стартуют; Модель
  не настроена в LiteLLM: сохранение агента отклоняется с указанием модели, 400 (FR-58 «Модель без доступа»); LiteLLM
  недоступен при проверке модели: смена модели не сохраняется, 503 и сообщение «проверить модель нельзя, повторите»;
  правка без смены модели сохраняется (FR-58 «Шлюз недоступен»); Platform module работает внутри api ICPlan: отдельного
  отказа нет: недоступен api — недоступен весь экран'
why: 'UI уже есть — не пишем свою консоль; наши настройки добавляются экранами Platform module у своего объекта:
  агент — в карточке, проект — в проекте, экземпляр — в God mode (AD-24).'
screens:
- path: Команда → Настройки → ИИ-агенты
  shows: список агентов, поиск, создание; у внешнего агента — в сети ли раннер
  status: есть
  file: apps/web/src/app/[teamRef]/settings/ai-agents/page.tsx
  story: '4.20'
- path: ИИ-агенты → агент (боковая панель)
  shows: 'модель и ключ провайдера (внутренний), инструкция, проекты, доступ (кто даёт работу), действия в проекте,
    триггеры (упоминание, делегат, поле), ключ API и раннер (внешний); у внешнего агента платформы — поля Registry:
    модель-алиас, навыки, …'
  status: доработка
  file: apps/web/src/features/teams/components/ai-agents/AgentSheetForm.tsx, TeamAiAgentFields.tsx
  story: '4.21'
- path: карточка агента
  shows: 'выключить / включить; судьба активных запусков `onDisable`: finish / cancel'
  status: доработка
  file: apps/web/src/features/teams/components/ai-agents/AgentSheetForm.tsx
  story: '4.22'
- path: карточка агента → запуски
